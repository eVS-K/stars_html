<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIANGULAR FIELD : EVOLVED</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #080b12;
    }
    canvas {
      display: block;
    }
    .hint {
      position: fixed;
      right: 16px;
      bottom: 14px;
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: .08em;
      color: rgba(230,235,245,.34);
      user-select: none;
      pointer-events: none;
      mix-blend-mode: screen;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
</head>
<body>
<div class="hint">MOVE · CLICK · SPACE · R · S</div>

<script>
/*
  TRIANGULAR FIELD : EVOLVED
  --------------------------------------------
  Controls
    Mouse move : bend / excite the local field
    Click      : emit a local shock wave
    Space      : emit a strong wave from center
    R          : regenerate field seeds
    S          : save current frame as PNG

  Design goals
    - geometric, cool, restrained
    - no excessive glow
    - emergence of larger structures from small triangles
    - calm background breathing rather than flashy effects
*/

let cells = [];
let impulses = [];
let arcs = [];
let t = 0;
let mouseEnergy = 0;
let fieldSeed = 1;

const TRI_SIDE = 31;
const TRI_H = TRI_SIDE * Math.sqrt(3) / 2;

class Cell {
  constructor(x, y, up, gx, gy) {
    this.x = x;
    this.y = y;
    this.up = up;
    this.gx = gx;
    this.gy = gy;

    this.phase = random(TWO_PI);
    this.seed = random(1000);
    this.energy = 0;
    this.energyTarget = 0;
    this.angle = up ? 0 : PI;
    this.angleTarget = this.angle;
    this.scale = 0.5;
    this.scaleTarget = 0.5;
  }

  computeField() {
    const nx = this.x / max(width, 1);
    const ny = this.y / max(height, 1);

    const cx = width * 0.5;
    const cy = height * 0.5;
    const dx = this.x - cx;
    const dy = this.y - cy;
    const d = sqrt(dx * dx + dy * dy);
    const a = atan2(dy, dx);

    // slow large-scale interference
    const planeA = sin(this.x * 0.0105 + t * 0.66);
    const planeB = sin(this.y * 0.0120 - t * 0.49);
    const planeC = sin((this.x - this.y) * 0.0070 + t * 0.31);

    // rotating triangular symmetry
    const triSym =
      cos(a * 3.0 + t * 0.31) *
      sin(d * 0.018 - t * 0.92);

    // hexagonal shell pattern
    const hex =
      sin(d * 0.027 - t * 1.38) *
      (0.45 + 0.55 * cos(a * 6.0 - t * 0.12));

    // moving nodes / "gravitational lenses"
    const lens1x = width * 0.5 + cos(t * 0.17) * width * 0.24;
    const lens1y = height * 0.5 + sin(t * 0.21) * height * 0.19;
    const lens2x = width * 0.5 + cos(t * 0.13 + PI) * width * 0.19;
    const lens2y = height * 0.5 + sin(t * 0.16 + 1.7) * height * 0.25;

    const d1 = dist(this.x, this.y, lens1x, lens1y);
    const d2 = dist(this.x, this.y, lens2x, lens2y);

    const lens =
      exp(-sq(d1 / 210)) * sin(d1 * 0.030 - t * 1.2) -
      exp(-sq(d2 / 240)) * cos(d2 * 0.025 + t * 0.9);

    // continuous noise for subtle irregularity
    const n =
      noise(
        fieldSeed + nx * 2.3,
        fieldSeed * 2.0 + ny * 2.3,
        t * 0.055
      ) * 2 - 1;

    // mouse distortion
    const md = dist(this.x, this.y, mouseX, mouseY);
    const mouseField =
      exp(-sq(md / 145)) *
      mouseEnergy *
      (1.2 + 0.5 * sin(md * 0.055 - t * 2.0));

    // shock waves
    let shock = 0;
    for (const p of impulses) {
      const pd = dist(this.x, this.y, p.x, p.y);
      const front = p.age * p.speed;
      shock +=
        exp(-sq((pd - front) / p.width)) *
        sin(pd * 0.070 - p.age * 8.0) *
        p.power;
    }

    // sparse "seams" that make larger geometry appear
    const seamA = abs(sin((this.gx + this.gy) * 0.22 + t * 0.11));
    const seamB = abs(sin((this.gx - this.gy) * 0.17 - t * 0.08));
    const seam = pow(max(seamA, seamB), 8.0);

    this.energyTarget =
      planeA * 0.16 +
      planeB * 0.13 +
      planeC * 0.10 +
      triSym * 0.35 +
      hex * 0.28 +
      lens * 0.38 +
      n * 0.20 +
      mouseField * 1.2 +
      shock +
      seam * 0.12;

    // orientation follows field flow but remains recognisably triangular
    const flowAngle =
      atan2(
        sin(this.y * 0.006 - t * 0.35),
        cos(this.x * 0.006 + t * 0.30)
      );

    this.angleTarget =
      (this.up ? 0 : PI) +
      this.energyTarget * 0.42 +
      flowAngle * 0.08;

    const active = constrain(abs(this.energyTarget), 0, 1.7);
    this.scaleTarget = 0.31 + active * 0.34 + seam * 0.11;
  }

  update() {
    this.computeField();

    this.energy = lerp(this.energy, this.energyTarget, 0.075);
    this.angle = lerpAngle(this.angle, this.angleTarget, 0.07);
    this.scale = lerp(this.scale, this.scaleTarget, 0.085);
  }

  draw() {
    const e = constrain(this.energy, -1.5, 1.5);
    const ae = abs(e);

    // cool palette shifts gently with the field
    const hueBase = 215 + e * 16 + sin(t * 0.10) * 5;
    const sat = 18 + ae * 14;
    const bri = 58 + ae * 24;
    const alphaFill = 38 + ae * 82;
    const alphaStroke = 42 + ae * 98;

    push();
    translate(this.x, this.y);
    rotate(this.angle);
    scale(this.scale);

    // restrained inner fill
    noStroke();
    fill(hueBase, sat, bri, alphaFill);
    triShape(0.92);

    // crisp main outline
    noFill();
    stroke(hueBase + 5, sat * 0.75, 92, alphaStroke);
    strokeWeight(0.82 / this.scale);
    triShape(1.0);

    // secondary inset line creates depth without heavy glow
    if (ae > 0.36) {
      stroke(hueBase - 8, max(8, sat - 5), 95, 18 + ae * 48);
      strokeWeight(0.45 / this.scale);
      triShape(0.72);
    }

    pop();
  }
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(min(window.devicePixelRatio || 1, 2));
  colorMode(HSB, 360, 100, 100, 255);
  noiseSeed(floor(random(1e9)));
  fieldSeed = random(1000);
  rebuild();
}

function rebuild() {
  cells = [];
  const cols = ceil(width / (TRI_SIDE * 0.5)) + 8;
  const rows = ceil(height / TRI_H) + 6;

  for (let row = -3; row < rows; row++) {
    for (let col = -4; col < cols; col++) {
      const x = col * TRI_SIDE * 0.5;
      const up = ((row + col) & 1) === 0;
      const y = row * TRI_H + (up ? TRI_H * 0.33 : TRI_H * 0.67);
      cells.push(new Cell(x, y, up, col, row));
    }
  }
}

function draw() {
  t = millis() / 1000;

  drawBackground();

  const motion = abs(mouseX - pmouseX) + abs(mouseY - pmouseY);
  const desiredMouseEnergy = constrain(motion * 0.032, 0, 1.15);
  mouseEnergy = lerp(mouseEnergy, desiredMouseEnergy, 0.11);

  updateImpulses();
  updateArcs();

  // fine background architecture
  drawMacroGeometry();

  for (const c of cells) {
    c.update();
    c.draw();
  }

  // sparse connecting filaments only where the field is active
  drawConnections();

  drawArcs();
  drawVignette();
}

function drawBackground() {
  const mood =
    sin(t * 0.11) * 0.75 +
    sin(t * 0.031 + 2.0) * 0.55;

  background(
    224 + mood * 4.0,
    30 + mood * 2.0,
    6.4 + mood * 0.75
  );

  // very subtle radial haze
  push();
  noStroke();
  const cx = width * 0.5;
  const cy = height * 0.5;
  const maxR = min(width, height) * 0.72;
  for (let i = 7; i >= 1; i--) {
    const r = maxR * (i / 7);
    fill(215 + mood * 3, 18, 18 + mood * 1.5, 2.4);
    ellipse(cx, cy, r * 2, r * 2);
  }
  pop();
}

function drawMacroGeometry() {
  push();
  translate(width * 0.5, height * 0.5);

  const base = min(width, height) * 0.16;

  // rotating nested triangles
  for (let layer = 0; layer < 4; layer++) {
    push();
    rotate((layer % 2 ? -1 : 1) * t * (0.012 + layer * 0.003));
    noFill();
    stroke(
      214 + layer * 4,
      14,
      90,
      17 - layer * 2
    );
    strokeWeight(0.85);

    const r =
      base *
      (1.0 + layer * 0.56) *
      (1.0 + sin(t * 0.31 + layer) * 0.012);

    beginShape();
    for (let i = 0; i < 3; i++) {
      const a = -HALF_PI + i * TWO_PI / 3;
      vertex(cos(a) * r, sin(a) * r);
    }
    endShape(CLOSE);
    pop();
  }

  // whisper-thin hexagon
  rotate(t * 0.009);
  noFill();
  stroke(210, 10, 88, 11);
  strokeWeight(0.8);

  const hr = base * 2.75;
  beginShape();
  for (let i = 0; i < 6; i++) {
    const a = -HALF_PI + i * TWO_PI / 6;
    vertex(cos(a) * hr, sin(a) * hr);
  }
  endShape(CLOSE);

  pop();
}

function drawConnections() {
  push();
  strokeWeight(0.55);

  const step = 5;

  for (let i = 0; i < cells.length; i += step) {
    const c = cells[i];
    const ae = abs(c.energy);

    if (ae < 0.78) continue;

    const angle =
      c.angle +
      ((c.gx + c.gy) % 2 === 0 ? PI / 3 : -PI / 3);

    const len = 12 + ae * 13;

    const x2 = c.x + cos(angle) * len;
    const y2 = c.y + sin(angle) * len;

    stroke(
      212 + c.energy * 8,
      15,
      92,
      12 + ae * 30
    );

    line(c.x, c.y, x2, y2);
  }

  pop();
}

function updateImpulses() {
  for (let i = impulses.length - 1; i >= 0; i--) {
    const p = impulses[i];
    p.age += deltaTime / 1000;
    p.power *= 0.9915;

    if (p.age > 5.8 || p.power < 0.03) {
      impulses.splice(i, 1);
    }
  }
}

function updateArcs() {
  for (let i = arcs.length - 1; i >= 0; i--) {
    arcs[i].age += deltaTime / 1000;
    if (arcs[i].age > arcs[i].life) arcs.splice(i, 1);
  }
}

function drawArcs() {
  push();
  noFill();

  for (const a of arcs) {
    const k = a.age / a.life;
    const alpha = 75 * (1 - k);
    const r = a.radius + k * 115;

    stroke(a.hue, 16, 94, alpha);
    strokeWeight(0.9);

    arc(
      a.x,
      a.y,
      r * 2,
      r * 2,
      a.start + k * 0.3,
      a.end + k * 0.3
    );
  }

  pop();
}

function drawVignette() {
  push();
  noFill();
  for (let i = 0; i < 9; i++) {
    stroke(225, 35, 3, 6 + i * 2);
    strokeWeight(18);
    rect(
      -i * 10,
      -i * 10,
      width + i * 20,
      height + i * 20
    );
  }
  pop();
}

function triShape(scaleFactor) {
  const r = TRI_H * 0.67 * scaleFactor;

  triangle(
    0, -r,
    -TRI_SIDE * 0.5 * scaleFactor, r * 0.5,
     TRI_SIDE * 0.5 * scaleFactor, r * 0.5
  );
}

function emitImpulse(x, y, power = 1.8, speed = 220, width = 72) {
  impulses.push({
    x,
    y,
    age: 0,
    power,
    speed,
    width
  });

  // visual circular fragments; intentionally sparse
  const pieces = 3;
  for (let i = 0; i < pieces; i++) {
    const start = random(TWO_PI);
    arcs.push({
      x,
      y,
      age: 0,
      life: random(0.7, 1.25),
      radius: random(18, 42),
      start,
      end: start + random(0.45, 1.1),
      hue: random(202, 228)
    });
  }
}

function mousePressed() {
  emitImpulse(mouseX, mouseY, 1.95, 230, 68);
}

function doubleClicked() {
  emitImpulse(width * 0.5, height * 0.5, 3.25, 255, 84);
  return false;
}

function keyPressed() {
  if (key === ' ') {
    emitImpulse(width * 0.5, height * 0.5, 3.6, 265, 90);
    return false;
  }

  if (key === 'r' || key === 'R') {
    noiseSeed(floor(random(1e9)));
    fieldSeed = random(1000);
    rebuild();
  }

  if (key === 's' || key === 'S') {
    const stamp = new Date()
      .toISOString()
      .replace(/[:.]/g, '-');

    saveCanvas(
      `triangular-field-${stamp}`,
      'png'
    );
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  rebuild();
}

function lerpAngle(a, b, amt) {
  let d = (b - a + PI) % TWO_PI - PI;
  return a + d * amt;
}
</script>
</body>
</html>
